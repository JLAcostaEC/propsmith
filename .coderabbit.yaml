# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: >-
  Be direct and technical. Prioritize correctness, public API stability and Node/ESM
  compatibility over style nits. Do not comment on formatting: oxfmt owns it.
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: false
  poem: false
  abort_on_close: true

  # Generated, vendored and scratch files are not worth reviewing.
  path_filters:
    - "!dist/**"
    - "!pnpm-lock.yaml"
    - "!CHANGELOG.md"
    - "!LICENSE.md"
    - "!test/.tmp/**"

  path_instructions:
    - path: "src/**/*.ts"
      instructions: >-
        The core must stay framework-agnostic: nothing under `src/` outside `src/adapters/` and
        `src/i18n/adapters/` may know about Svelte, React or a specific i18n tool. Flag any import
        that breaks that. Type resolution is syntactic — never suggest the TypeScript checker or a
        `Program`. Keep `src/render/**` pure: no filesystem access, no config reading. `src/run.ts`
        is the only module allowed to write files.
    - path: "src/render/**/*.ts"
      instructions: >-
        Generated markdown must never contain an HTML tag, and a `|` must never survive inside a
        code span. Flag any new emitted string that could break either rule, or that bypasses
        `escapeCell` / `codeSpan` / `assertNoHtml`.
    - path: "src/i18n/**/*.ts"
      instructions: >-
        The staleness algorithm in `sync.ts` is core and must stay pure: it may not read or write
        files. Adapters only read, write and speak their tool's syntax. Catalog keys are identifiers
        and a key change silently orphans translations, so flag any change to key naming that is not
        paired with a documented migration.
    - path: "test/**/*.ts"
      instructions: >-
        Vitest, importing the source modules directly. Filesystem work belongs in a temp directory
        created per test and removed in `afterEach`. Assertions about tables should compare content,
        not column padding.
    - path: "docs/**/*.md"
      instructions: >-
        User-facing reference documentation. Flag statements that describe behaviour the code does
        not have, and internal design history or rationale that a user does not need. Keep it short
        and factual.
    - path: ".github/workflows/**"
      instructions: >-
        Pin actions, keep `permissions` minimal, and do not add steps that need secrets to a
        pull_request-triggered workflow.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - main
    ignore_title_keywords:
      - wip
      - "do not review"
      - "Version Packages"

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

  pre_merge_checks:
    title:
      mode: warning
      requirements: >-
        The title must start with one of `feat:`, `fix:`, `chore:`, `docs:`, `test:`, `refactor:`,
        `perf:` or `breaking:` followed by a concise, imperative description of the change.
        Reject vague titles like "updates" or "fixes". Exempt release PRs titled
        "Version Packages".
    description:
      mode: warning
    docstrings:
      mode: "off"
    issue_assessment:
      mode: warning
    custom_checks:
      - name: Changeset present
        mode: warning
        instructions: >-
          If the PR touches `src/**`, `bin.ts` or the published fields of `package.json`, it must
          add a changeset file under `.changeset/`. Pass the check when the PR only touches tests,
          docs, CI, tooling config or lockfiles, and when it is a changesets release PR
          ("Version Packages").
      - name: Public API and docs in sync
        mode: warning
        instructions: >-
          If an exported symbol in `src/index.ts`, `src/adapters/index.ts` or
          `src/i18n/adapters/index.ts` changed, or a CLI flag in `src/cli/index.ts` was added,
          renamed or removed, the matching page under `docs/` — and `README.md` when the change is
          visible in its quick start — must be updated in the same PR, and the changeset must use
          the matching bump level (major for removals and renames).
      - name: Tag and diagnostic surface documented
        mode: warning
        instructions: >-
          If a JSDoc tag propsmith understands or a `DiagnosticCode` was added, renamed or removed
          in `src/types.ts`, `src/extract/**` or `src/run.ts`, `docs/tags.md` and `docs/cli.md` must
          list it in the same PR.

  tools:
    # This repo lints with oxlint (`.oxlintrc.json`) and formats with oxfmt.
    oxc:
      enabled: true
    eslint:
      enabled: false
    biome:
      enabled: false
    github-checks:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
    semgrep:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    # oxfmt owns markdown formatting, and the generated tables in `docs/` are wider
    # than any line-length rule allows.
    markdownlint:
      enabled: false
    languagetool:
      enabled: true
      level: default

chat:
  auto_reply: true
  art: false

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - ".github/copilot-instructions.md"
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local

code_generation:
  docstrings:
    language: en-US
    path_instructions:
      - path: "src/**/*.ts"
        instructions: >-
          Use TSDoc. Document exported functions with a one-line summary, `@param` for each
          parameter, `@returns`, and `@throws` when the function can reject. Keep it terse and
          skip restating types already visible in the signature.
  unit_tests:
    path_instructions:
      - path: "src/**/*.ts"
        instructions: >-
          Write Vitest suites (`describe`/`it`/`expect`) in `test/<area>.test.ts`, matching the
          layout of the existing files there. Import the source module directly, keep filesystem
          work in a temp directory created with `mkdtempSync` and remove it in `afterEach`, and
          assert on table content rather than on column padding.
